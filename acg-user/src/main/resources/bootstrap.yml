server:
  port: 8081

spring:
  application:
    name: acg-user
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: false
        namespace: acg_agent
      config:
        enabled: false
        namespace: acg_agent
        shared-configs:
          - data-id: common-mysql.yaml
            refresh: true
          - data-id: common-dubbo.yaml
            refresh: true
          - data-id: common-jwt.yaml
            refresh: true
        extension-configs:
          - data-id: acg-user.yaml
            refresh: true
