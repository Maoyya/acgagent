# 本地只保留与代码结构绑定的配置，其余全部由 Nacos 提供
spring:
  config:
    import:
      - nacos:common-mysql.yaml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-dubbo.yaml?group=DEFAULT_GROUP&refresh=true
      - nacos:common-jwt.yaml?group=DEFAULT_GROUP&refresh=true
      - nacos:acg-user.yaml?group=DEFAULT_GROUP&refresh=true
  cloud:
    nacos:
      config:
        namespace: acg_agent

# 关闭 Dubbo QoS 诊断服务：默认占用 22222 端口，与 acg-chat 同机启动会冲突（BindException）
dubbo:
  application:
    qos-enable: false
