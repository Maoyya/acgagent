server:
  port: 8080

spring:
  application:
    name: acgagent
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/acg_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      filter:
        stat:
          enabled: true
          slow-sql-millis: 3000
          log-slow-sql: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: acgagent-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

wx:
  open:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}

sms:
  provider: ${SMS_PROVIDER:mock}
  access-key-id: ${SMS_AK:}
  access-key-secret: ${SMS_SK:}
  sign-name: ${SMS_SIGN:}
  template-code: ${SMS_TEMPLATE:}
