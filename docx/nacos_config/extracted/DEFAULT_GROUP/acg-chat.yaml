dubbo:
  protocol:
    name: tri
    port: 20882
  consumer:
    check: false
  scan:
    base-packages: com.darkness.agent.dubbo

management:
  tracing:
    sampling:
      probability: ${ZIPKIN_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}