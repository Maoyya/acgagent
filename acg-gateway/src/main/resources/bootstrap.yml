server:
  port: 8080

spring:
  application:
    name: acg-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        namespace: acg_agent
      config:
        namespace: acg_agent
        shared-configs:
          - data-id: common-jwt.yaml
            refresh: true
        extension-configs:
          - data-id: acg-gateway.yaml
            refresh: true
